[project]
name = "besst"
version = "0.1.0"
description = "NSW1 battery arbitrage dashboard on AEMO dispatch and forecast data"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.32",
    "dash>=2.17",
    "dash-mantine-components==0.14.7",
    "plotly>=5.22",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
besst = "besst.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["besst"]
